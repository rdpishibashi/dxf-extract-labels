[pytest]
# ezdxf内部（virtual_entities()の4x4行列変換、`ezdxf/math/_matrix44.py`）が出す
# numpy非推奨警告を抑制する（2026-10-08）。
#
# region_detector.py の領域検出アルゴリズムは実DXFファイルの多数のエンティティに
# 対して座標変換を行うため、この警告がテスト全体で54,000件以上重複して出力され、
# 出力の可読性とpytestの警告収集オーバーヘッドを悪化させていた（特に
# tests/regression/test_region_extraction.py・test_region_naming_cross_project.py
# の2ファイルで全体の99%超を占める）。
#
# 警告元はこちらのコードではなくezdxf側（インストール済みバージョン1.4.4で確認）。
# テストの判定ロジックには一切影響しない（表示・収集を抑制するだけ）。
filterwarnings =
    ignore:Setting the shape on a NumPy array has been deprecated.*:DeprecationWarning:ezdxf.math._matrix44
